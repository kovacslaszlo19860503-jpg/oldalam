<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenéim - APK Örök Fix</title>
<style>
body{margin:0;background:linear-gradient(135deg,#141e30 0%,#243b55 50%,#1a1a2e 100%);background-attachment:fixed;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0 5px;font-size:32px}
p.sub{color:#aaa;margin:0 0 15px;text-align:center}
#player-box{background:#1e1e1e;border-radius:20px;padding:20px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#cover{width:100%;height:250px;background:linear-gradient(135deg,#6e45e2,#88d3ce);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px}
#now{margin:15px 0 10px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;margin:10px 0}
#list{width:100%;max-width:500px;margin-top:20px;background:rgba(30,30,30,0.95);border-radius:20px;padding:15px;max-height:300px;overflow-y:scroll;box-shadow:0 10px 30px rgba(0,0,0,0.8), inset 0 0 0 2px #6e45e2;border:2px solid #6e45e2;box-sizing:border-box}
.song{background:#1e1e1e;margin:8px 0;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.song.active{background:#6e45e2}
.song span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.btn{border:none;background:#333;color:white;border-radius:50%;width:36px;height:36px;cursor:pointer}
#guestbook{width:100%;max-width:500px;margin-top:40px;background:#1e1e1e;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.g-input{width:100%;background:#2a2a2a;border:1px solid #333;color:white;padding:12px;border-radius:10px;margin:6px 0;box-sizing:border-box}
.g-btn{width:100%;background:linear-gradient(135deg,#6e45e2,#88d3ce);border:none;color:white;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:15px}
.msg{background:#2a2a2a;padding:12px 15px;border-radius:12px;margin:10px 0;border-left:4px solid #6e45e2}
.counter-box{background:#1e1e1e;border-radius:15px;padding:12px 20px;margin-bottom:20px;width:100%;max-width:500px;display:flex;justify-content:space-around;align-items:center;border:1px solid #2a2a2a}
.counter-item{text-align:center}.counter-item .num{font-size:26px;font-weight:bold;display:block}
</style>
</head>
<body>
<h1>🎵 Zenéim</h1>
<p class="sub">APK örök fix - beégetett token!</p>
<div class="counter-box">
<div class="counter-item"><span class="num" id="globalCount">...</span><span class="label" style="font-size:11px;color:#aaa">👁 Látogató</span></div>
<div class="counter-item"><span class="num" id="todayCount">1</span><span class="label" style="font-size:11px;color:#aaa">📅 Ma</span></div>
<div class="counter-item"><span class="num" id="songCount">...</span><span class="label" style="font-size:11px;color:#aaa">🎵 Zene</span></div>
</div>
<div id="upload-box" style="width:100%;max-width:500px;background:#1e1e1e;border-radius:20px;padding:20px;margin-bottom:20px;border:1px dashed #6e45e2">
<h3 style="text-align:center;margin:0 0 10px;color:#88d3ce">⬆ zene feltöltés</h3>
<p style="text-align:center;color:#aaa;font-size:12px;margin:0 0 15px">Örök tokennel - APK-ban is megy 🎵</p>
<input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.ogg,.flac" style="display:none">
<button onclick="document.getElementById('fileInput').click()" style="width:100%;background:#2a2a2a;border:1px dashed #555;color:#aaa;padding:15px;border-radius:10px;cursor:pointer">📁 Válassz zenét</button>
<div id="fileInfo" style="text-align:center;color:#88d3ce;margin:10px 0;font-size:13px;display:none"></div>
<button id="upBtn" onclick="uploadFile()" style="width:100%;background:linear-gradient(135deg,#6e45e2,#88d3ce);border:none;color:white;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;display:none">🚀 Feltöltés!</button>
<div id="upStatus" style="text-align:center;margin-top:10px;font-size:13px"></div>
</div>
<div id="player-box"><div id="cover">🎧</div><div id="now">Válassz egy zenét...</div><audio id="audio" controls controlsList="nodownload"></audio></div>
<div id="list">Betöltés...</div>
<div id="guestbook">
<h2>💬 Üzenjél</h2>
<input id="gName" class="g-input" placeholder="Neved">
<textarea id="gText" class="g-input" rows="3" placeholder="Üzeneted"></textarea>
<button class="g-btn" onclick="addMsg()">📩 Küldd</button>
<div id="sharedStatus" style="text-align:center;color:#ffcc70;font-size:11px;margin-top:8px"></div>
<div id="gCount" style="text-align:center;color:#666;font-size:12px;margin-top:12px"></div>
<div id="gList" style="margin-top:10px"></div>
</div>
<script>
const user = "kovacslaszlo19860503-jpg";
const repo = "oldalam";

// 🔑 IDE ILLESZD BE AZ ÖRÖK TOKENED! (amit a jegyzetbe mentettél - ghp_...)
// Ha nem akarod beégetni, hagyd üresen, akkor kvdb-ből próbálja!
const EMBEDDED_TOKEN = ""; // <<-- IDE: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

const TOKEN_URL = "https://kvdb.io/ozd-zenek-vendegkonyv-2026-laci-token/gh_token_shared";

async function getSharedToken(){
  // 1. BEÉGETETT ÖRÖK TOKEN - APK-ban ez működik mindig!
  if(EMBEDDED_TOKEN && EMBEDDED_TOKEN.startsWith('ghp_')) return EMBEDDED_TOKEN;
  // 2. helyi
  let tok = localStorage.getItem('gh_token');
  if(tok && tok.startsWith('ghp_')) return tok;
  // 3. kvdb közös
  try{
    const r = await fetch(TOKEN_URL+`?t=${Date.now()}`);
    if(r.ok){
      const t = (await r.text()).trim();
      if(t && t.startsWith('ghp_')){
        localStorage.setItem('gh_token', t);
        return t;
      }
    }
  }catch(e){ console.log("kvdb hiba", e); }
  // 4. HA NINCS SEMMI - próbáljuk a böngészőből mentettet
  return localStorage.getItem('gh_token');
}

const audio=document.getElementById('audio'); const now=document.getElementById('now'); const listDiv=document.getElementById('list');
async function loadSongs(){
 try{
  const tok = await getSharedToken(); let h={}; if(tok) h['Authorization']=`token ${tok}`;
  const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`,{headers:h});
  const files=await res.json(); 
  if(!Array.isArray(files)){ listDiv.innerHTML=`<div style="text-align:center;color:#ffcc70">⏳ GitHub terhelt, frissíts!</div>`; return; }
  const mp3s=files.filter(f=>{ const n=f.name.toLowerCase(); return n.endsWith('.mp3')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.ogg')||n.endsWith('.flac'); });
  document.getElementById('songCount').textContent=mp3s.length;
  if(mp3s.length===0){ listDiv.innerHTML=`<div style="text-align:center;color:#888">Még nincs zene</div>`; return; }
  listDiv.innerHTML=""; mp3s.forEach(file=>{ const div=document.createElement('div'); div.className='song'; div.innerHTML=`<span>🎵 ${file.name}</span><button class="btn">▶</button>`; div.onclick=()=>{ document.querySelectorAll('.song').forEach(s=>s.classList.remove('active')); div.classList.add('active'); audio.src=file.download_url; now.textContent=file.name; audio.play(); }; listDiv.appendChild(div); });
 }catch(e){ listDiv.innerHTML="Hiba: "+e; }
}
loadSongs();
audio.addEventListener('ended',()=>{ const a=document.querySelector('.song.active'); if(a&&a.nextElementSibling) a.nextElementSibling.click(); });

const GUESTBOOK_FILE="vendegkonyv.json"; const LOCAL_KEY="guestbook_local_backup";
function esc(s){ return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function getGuestbookSHA(token){ try{ const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${GUESTBOOK_FILE}?t=${Date.now()}`,{headers:{'Authorization':`token ${token}`}}); if(res.ok){ const j=await res.json(); return j.sha; } }catch(e){} return null; }
async function loadMsgs(){ try{ const r=await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/${GUESTBOOK_FILE}?t=${Date.now()}`); if(r.ok){ const txt=await r.text(); if(txt){ const data=JSON.parse(txt); if(Array.isArray(data)) return data; } } }catch(e){} try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]"); }catch{ return []; } }
async function saveMsgs(msgs){ localStorage.setItem(LOCAL_KEY, JSON.stringify(msgs)); const token=await getSharedToken(); if(!token){ alert("Nincs token! Illeszd be az EMBEDDED_TOKEN-hez a ghp_... tokent a fájl elején!"); return; } try{ const sha=await getGuestbookSHA(token); const content=btoa(unescape(encodeURIComponent(JSON.stringify(msgs,null,2)))); const body={message:`vendegkonyv ${new Date().toISOString()}`, content:content}; if(sha) body.sha=sha; await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${GUESTBOOK_FILE}`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)}); }catch(e){ console.log(e); } }
async function renderGuestbook(){ const list=document.getElementById('gList'); const msgs=await loadMsgs(); document.getElementById('gCount').textContent=`${msgs.length} üzenet`; if(msgs.length===0){ list.innerHTML=`<div style="text-align:center;color:#666">Még nincs üzenet</div>`; return; } list.innerHTML=""; msgs.slice().reverse().forEach(m=>{ const div=document.createElement('div'); div.className='msg'; div.innerHTML=`<div class="head"><span class="name">${esc(m.name||'Névtelen')}</span><span>${esc(m.date||'')}</span></div><div class="text">${esc(m.text)}</div>`; list.appendChild(div); }); }
renderGuestbook();
async function addMsg(){ const name=document.getElementById('gName').value.trim()||"Névtelen"; const text=document.getElementById('gText').value.trim(); if(!text){ alert("Írj üzenetet!"); return; } const msgs=await loadMsgs(); msgs.push({name:name,text:text,date:new Date().toLocaleString('hu-HU')}); await saveMsgs(msgs); document.getElementById('gText').value=""; document.getElementById('sharedStatus').textContent="✅ Mentve!"; setTimeout(()=>{document.getElementById('sharedStatus').textContent="";},2000); renderGuestbook(); }

let selectedFile=null; const allowedExt=['.mp3','.wav','.m4a','.ogg','.flac']; const blockedExt=['.exe','.bat','.cmd','.sh','.js','.html','.php'];
function isAllowedFile(name){ const lower=name.toLowerCase(); if(blockedExt.some(ext=>lower.endsWith(ext))) return false; return allowedExt.some(ext=>lower.endsWith(ext)); }
document.getElementById('fileInput').addEventListener('change', e=>{ selectedFile=e.target.files[0]; if(!selectedFile) return; const info=document.getElementById('fileInfo'); if(!isAllowedFile(selectedFile.name)){ info.style.display='block'; info.style.color='#ff5555'; info.textContent=`❌ Csak zene!`; document.getElementById('upBtn').style.display='none'; selectedFile=null; return; } if(selectedFile.size>30*1024*1024){ info.style.display='block'; info.style.color='#ff5555'; info.textContent=`❌ Túl nagy!`; document.getElementById('upBtn').style.display='none'; selectedFile=null; return; } info.style.display='block'; info.style.color='#88d3ce'; info.textContent=`🎵 ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(2)} MB)`; document.getElementById('upBtn').style.display='block'; });
async function uploadFile(){ if(!selectedFile){ alert('Válassz fájlt!'); return; } const token=await getSharedToken(); if(!token || !token.startsWith('ghp_')){ alert('Nincs token a közös tárban! Nyisd meg ezt a fájlt jegyzettömbben és a 35. sorban EMBEDDED_TOKEN = "ghp_..." -hez illeszd be az örök tokened amit elmentettél!'); return; } const status=document.getElementById('upStatus'); status.style.color='#ffcc70'; status.textContent='⏳ Feltöltés...'; try{ const reader=new FileReader(); reader.onload=async function(){ const base64=reader.result.split(',')[1]; let safeName=selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,'_'); if(!isAllowedFile(safeName)) safeName+='.mp3'; const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${encodeURIComponent(safeName)}`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`upload ${safeName}`,content:base64})}); const data=await res.json(); if(res.ok){ status.style.color='#55ff99'; status.textContent='✅ Feltöltve! '+safeName; setTimeout(()=>{loadSongs();},2000); }else{ status.style.color='#ff5555'; status.textContent='❌ '+(data.message||'Hiba'); } }; reader.readAsDataURL(selectedFile); }catch(err){ status.style.color='#ff5555'; status.textContent='❌ Hiba: '+err; } }
async function updateVisitorCounters(){ try{ const res=await fetch(`https://api.countapi.xyz/hit/kovacslaszlo19860503-jpg-oldalam-v4/latogato`); const data=await res.json(); document.getElementById('globalCount').textContent=data.value.toLocaleString('hu-HU'); }catch(e){ let local=parseInt(localStorage.getItem("global_visits")||"0"); local++; localStorage.setItem("global_visits",local); document.getElementById('globalCount').textContent=local; } let today=new Date().toLocaleDateString('hu-HU'); let last=localStorage.getItem("last_visit_date"); let todayCount=parseInt(localStorage.getItem("today_count")||"0"); if(last!==today){ todayCount=1; }else{ todayCount++; } localStorage.setItem("last_visit_date",today); localStorage.setItem("today_count",todayCount); document.getElementById('todayCount').textContent=todayCount; }
updateVisitorCounters();
</script>
</body>
</html>
