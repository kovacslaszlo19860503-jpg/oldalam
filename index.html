<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenéim</title>
<style>
body{margin:0;background:linear-gradient(135deg,#141e30 0%,#243b55 50%,#1a1a2e 100%);background-attachment:fixed;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0 5px;font-size:32px}
p.sub{color:#aaa;margin:0 0 15px;text-align:center}
#main-nav{background:#1e1e1e;border-radius:15px;padding:10px;width:100%;max-width:500px;display:flex;justify-content:center;gap:10px;margin-bottom:20px;border:1px solid #2a2a2a}
.nav-btn{border:none;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;text-decoration:none;color:white;font-size:14px}
.nav-btn.active{background:#6e45e2}
.nav-btn.inactive{background:#333}
#player-box{background:#1e1e1e;border-radius:20px;padding:20px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#cover{width:100%;height:250px;background:#000;border-radius:15px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#visualizer{width:100%;height:100%;display:block}
#cover-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:0.3;pointer-events:none}
#now{margin:15px 0 10px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;margin:10px 0}
#ticker-wrap{width:100%;max-width:500px;background:#000;border:2px solid #6e45e2;border-radius:10px;margin-top:12px;overflow:hidden;height:36px;display:flex;align-items:center}
#ticker{white-space:nowrap;display:inline-block;padding-left:100%;animation:scroll 20s linear infinite;color:#88d3ce;font-weight:bold;font-size:15px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#list{width:100%;max-width:500px;margin-top:15px;background:rgba(30,30,30,0.95);border-radius:20px;padding:15px;max-height:400px;overflow-y:auto;border:2px solid #6e45e2}
.song{background:#1e1e1e;margin:8px 0;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.song.active{background:#6e45e2}
.counter-box{background:#1e1e1e;border-radius:15px;padding:12px 20px;margin-bottom:20px;width:100%;max-width:500px;display:flex;justify-content:space-around;border:1px solid #2a2a2a}
</style>
</head>
<body>
<h1>🎵 Zenéim</h1>
<p class="sub">diszkó zenék</p>
<div class="counter-box">
<div style="text-align:center"><span id="songCount" style="font-size:26px;font-weight:bold;display:block">...</span><span style="font-size:11px;color:#aaa">🎵 Zene</span></div>
<div style="text-align:center"><span id="globalCount" style="font-size:26px;font-weight:bold;display:block">...</span><span style="font-size:11px;color:#aaa">👁 Látogató</span></div>
</div>
<div id="main-nav">
<button class="nav-btn active">🎵 Zenék</button>
<a href="kepek.html" class="nav-btn inactive">📸 Képek</a>
</div>
<div id="player-box">
<div id="cover"><canvas id="visualizer"></canvas><div id="cover-overlay">🎧</div></div>
<div id="now">Válassz egy zenét...</div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>
<div id="ticker-wrap"><div id="ticker">🎵 Betöltés 🎵</div></div>
<div id="list">Betöltés...</div>
<script>
const user="kovacslaszlo19860503-jpg",repo="oldalam";
const audio=document.getElementById('audio'),now=document.getElementById('now'),listDiv=document.getElementById('list'),canvas=document.getElementById('visualizer'),ctx=canvas.getContext('2d');
let audioCtx,analyser,source,dataArray;
function initVisualizer(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();source=audioCtx.createMediaElementSource(audio);source.connect(analyser);analyser.connect(audioCtx.destination);analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);}}catch(e){}}
function draw(){requestAnimationFrame(draw);if(!analyser){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const t=Date.now()/200;for(let i=0;i<64;i++){const h=Math.abs(Math.sin(t/10+i*0.2))*canvas.height*0.8+10;const x=i*canvas.width/64;const hue=(i*4+t)%360;ctx.fillStyle=`hsl(${hue},100%,50%)`;ctx.fillRect(x,canvas.height-h,canvas.width/64-2,h);}return;}analyser.getByteFrequencyData(dataArray);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const bw=canvas.width/dataArray.length*2.5;let x=0;for(let i=0;i<dataArray.length;i++){const bh=dataArray[i]*canvas.height/255*0.9;const hue=i*360/dataArray.length+200;const g=ctx.createLinearGradient(0,canvas.height-bh,0,canvas.height);g.addColorStop(0,`hsl(${hue},100%,60%)`);g.addColorStop(1,`hsl(${hue},100%,20%)`);ctx.fillStyle=g;ctx.fillRect(x,canvas.height-bh,bw-1,bh);x+=bw;}}draw();
audio.addEventListener('play',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();initVisualizer();});
async function loadSongs(){try{const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);const files=await res.json();const mp3s=files.filter(f=>/.(mp3|wav|m4a|ogg|flac)$/i.test(f.name));document.getElementById('songCount').textContent=mp3s.length;listDiv.innerHTML="";mp3s.forEach(file=>{const div=document.createElement('div');div.className='song';div.innerHTML=`<span>🎵 ${file.name}</span><button style="border:none;background:#333;color:white;border-radius:50%;width:36px;height:36px">▶</button>`;div.onclick=()=>{document.querySelectorAll('.song').forEach(s=>s.classList.remove('active'));div.classList.add('active');audio.src=file.download_url;now.textContent=file.name;audio.play().catch(()=>{});initVisualizer();};listDiv.appendChild(div);});}catch(e){listDiv.innerHTML="Hiba: "+e;}}loadSongs();
async function updateVisitorCounters(){try{const res=await fetch(`https://api.countapi.xyz/hit/kovacslaszlo19860503-jpg-oldalam-v4/latogato`);const data=await res.json();document.getElementById('globalCount').textContent=data.value;}catch(e){}}updateVisitorCounters();
</script>
</body>
</html>
