<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenéim</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0 5px;font-size:32px}
p.sub{color:#aaa;margin:0 0 20px;text-align:center}
#player-box{background:#1e1e1e;border-radius:20px;padding:20px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#cover{width:100%;height:250px;background:linear-gradient(135deg,#6e45e2,#88d3ce);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px}
#now{margin:15px 0 10px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;margin:10px 0}
#list{width:100%;max-width:500px;margin-top:20px}
.song{background:#1e1e1e;margin:8px 0;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:0.2s}
.song:hover{background:#2a2a2a}
.song.active{background:#6e45e2}
.song span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.btn{border:none;background:#333;color:white;border-radius:50%;width:36px;height:36px;cursor:pointer}
</style>
</head>
<body>
<h1>🎵 Zenéim</h1>
<p class="sub">A feltöltött zenéim listája - kattints a lejátszáshoz</p>
<div id="player-box">
<div id="cover">🎧</div>
<div id="now">Válassz egy zenét...</div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>
<div id="list">Betöltés...</div>
<script>
const user = "kovacslaszlo19860503-jpg";
const repo = "oldalam";
const audio = document.getElementById('audio');
const now = document.getElementById('now');
const listDiv = document.getElementById('list');
async function loadSongs(){
 try{
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);
  const files = await res.json();
  const mp3s = files.filter(f=>{ const n=f.name.toLowerCase(); return n.endsWith('.mp3')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.mp4')||n.endsWith('.ogg')||n.endsWith('.flac'); });
  if(mp3s.length===0){
   listDiv.innerHTML = `<div style="text-align:center;color:#888;margin-top:20px">Még nincs feltöltve zene.<br>Tölts fel mp3 fájlokat a GitHub-ra!</div>`;
   return;
  }
  listDiv.innerHTML = "";
  mp3s.forEach((file,i)=>{
   const div = document.createElement('div');
   div.className = 'song';
   div.innerHTML = `<span>🎵 ${file.name}</span><button class="btn">▶</button>`;
   div.onclick = ()=>{
    document.querySelectorAll('.song').forEach(s=>s.classList.remove('active'));
    div.classList.add('active');
    const rawUrl = file.download_url;
    audio.src = rawUrl;
    now.textContent = file.name;
    audio.play();
   };
   listDiv.appendChild(div);
  });
 }catch(e){
  listDiv.innerHTML = "Hiba a betöltéskor: "+e;
 }
}
loadSongs();
audio.addEventListener('ended', ()=>{
 const active = document.querySelector('.song.active');
 if(active && active.nextElementSibling){
  active.nextElementSibling.click();
 }
});
</script>
</body>
</html>
