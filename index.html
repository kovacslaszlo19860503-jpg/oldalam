<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zene</title>
<style>
body{margin:0;background:linear-gradient(135deg,#141e30 0%,#243b55 50%,#1a1a2e 100%);background-attachment:fixed;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0 5px;font-size:32px}
p.sub{color:#aaa;margin:0 0 15px;text-align:center}
#player-box{background:#1e1e1e;border-radius:20px;padding:20px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#cover{width:100%;height:250px;background:linear-gradient(135deg,#6e45e2,#88d3ce);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px}
#now{margin:15px 0 10px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;margin:10px 0}
#list{width:100%;max-width:500px;margin-top:20px;background:rgba(30,30,30,0.95);border-radius:20px;padding:15px;max-height:400px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.8), inset 0 0 0 2px #6e45e2;border:2px solid #6e45e2;box-sizing:border-box}
.song{background:#1e1e1e;margin:8px 0;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:0.2s}
.song:hover{background:#2a2a2a}
.song.active{background:#6e45e2}
#guestbook{width:100%;max-width:500px;margin-top:40px;background:#1e1e1e;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.g-input{width:100%;background:#2a2a2a;border:1px solid #333;color:white;padding:12px;border-radius:10px;margin:6px 0;box-sizing:border-box}
.g-btn{width:100%;background:linear-gradient(135deg,#6e45e2,#88d3ce);border:none;color:white;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.msg{background:#2a2a2a;padding:12px 15px;border-radius:12px;margin:10px 0;border-left:4px solid #6e45e2}
.counter-box{background:#1e1e1e;border-radius:15px;padding:12px 20px;margin-bottom:20px;width:100%;max-width:500px;display:flex;justify-content:space-around;align-items:center;border:1px solid #2a2a2a}
</style>
</head>
<body>
<h1>🎵 Zene</h1>
<p class="sub">üzenet</p>

<div class="counter-box">
<div style="text-align:center"><span id="songCount" style="font-size:26px;font-weight:bold;display:block">...</span><span style="font-size:11px;color:#aaa">🎵 Zene</span></div>
<div style="text-align:center"><span id="globalCount" style="font-size:26px;font-weight:bold;display:block">...</span><span style="font-size:11px;color:#aaa">👁 Látogató</span></div>
</div>

<div id="player-box">
<div id="cover">🎧</div>
<div id="now">lejátszó</div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>
<div id="list">Betöltés...</div>

<div id="guestbook">
<h2 style="text-align:center;color:#6e45e2;margin:0 0 10px">💬 Üzenjél</h2>
<input id="gName" class="g-input" placeholder="Neved">
<textarea id="gText" class="g-input" rows="3" placeholder="Üzeneted"></textarea>
<button class="g-btn" onclick="addMsg()">📩 Küldd</button>
<div id="gCount" style="text-align:center;color:#666;font-size:12px;margin-top:12px"></div>
<div id="gList" style="margin-top:10px"></div>
<p style="text-align:center;color:#555;font-size:10px;margin-top:15px">Nincs token, nincs feltöltés, csak zene + üzenet - örökre működik!</p>
</div>

<script>
const user = "kovacslaszlo19860503-jpg";
const repo = "oldalam";
const audio=document.getElementById('audio'); const now=document.getElementById('now'); const listDiv=document.getElementById('list');

async function loadSongs(){
 try{
  // Token nélkül - public API, 60 kérés/óra elég!
  const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);
  const files=await res.json();
  if(!Array.isArray(files)){
    listDiv.innerHTML=`<div style="text-align:center;color:#ffcc70">⏳ GitHub terhelt, frissíts 1 perc múlva!</div>`;
    return;
  }
  const mp3s=files.filter(f=>{ const n=f.name.toLowerCase(); return n.endsWith('.mp3')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.ogg')||n.endsWith('.flac'); });
  document.getElementById('songCount').textContent=mp3s.length;
  if(mp3s.length===0){ listDiv.innerHTML=`<div style="text-align:center;color:#888">Még nincs zene a GitHub-on</div>`; return; }
  listDiv.innerHTML="";
  mp3s.forEach(file=>{
    const div=document.createElement('div'); div.className='song';
    div.innerHTML=`<span>🎵 ${file.name}</span><button style="border:none;background:#333;color:white;border-radius:50%;width:36px;height:36px">▶</button>`;
    div.onclick=()=>{ document.querySelectorAll('.song').forEach(s=>s.classList.remove('active')); div.classList.add('active'); audio.src=file.download_url; now.textContent=file.name; audio.play(); };
    listDiv.appendChild(div);
  });
 }catch(e){ listDiv.innerHTML="Hiba: "+e; }
}
loadSongs();
audio.addEventListener('ended',()=>{ const a=document.querySelector('.song.active'); if(a&&a.nextElementSibling) a.nextElementSibling.click(); });

// VENDÉGKÖNYV - csak kvdb, token nélkül!
const KVDB_URL = "https://kvdb.io/ozd-zenek-vendegkonyv-2026-laci/uzenetek";
function esc(s){ return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function loadMsgs(){
 try{
  const r=await fetch(KVDB_URL+`?t=${Date.now()}`);
  if(r.ok){ const txt=await r.text(); if(txt){ const d=JSON.parse(txt); if(Array.isArray(d)) return d; } }
 }catch(e){}
 return [];
}
async function saveMsgs(msgs){
 try{
  await fetch(KVDB_URL, {method:'POST', body: JSON.stringify(msgs)});
 }catch(e){ console.log("mentés hiba", e); }
}
async function renderGuestbook(){
 const list=document.getElementById('gList'); const msgs=await loadMsgs();
 document.getElementById('gCount').textContent=`${msgs.length} üzenet`;
 if(msgs.length===0){ list.innerHTML=`<div style="text-align:center;color:#666;padding:15px">Még nincs üzenet 👇</div>`; return; }
 list.innerHTML=""; msgs.slice().reverse().forEach(m=>{
  const div=document.createElement('div'); div.className='msg';
  div.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-bottom:6px"><span style="color:#88d3ce;font-weight:bold">${esc(m.name||'Névtelen')}</span><span>${esc(m.date||'')}</span></div><div style="color:#eee;word-wrap:break-word;white-space:pre-wrap">${esc(m.text)}</div>`;
  list.appendChild(div);
 });
}
renderGuestbook();
async function addMsg(){
 const name=document.getElementById('gName').value.trim()||"Névtelen";
 const text=document.getElementById('gText').value.trim();
 if(!text){ alert("Írj üzenetet!"); return; }
 const msgs=await loadMsgs();
 msgs.push({name:name, text:text, date:new Date().toLocaleString('hu-HU')});
 await saveMsgs(msgs);
 document.getElementById('gText').value="";
 renderGuestbook();
}

async function updateVisitorCounters(){
 try{
  const res=await fetch(`https://api.countapi.xyz/hit/kovacslaszlo19860503-jpg-oldalam-v4/latogato`);
  const data=await res.json();
  document.getElementById('globalCount').textContent=data.value;
 }catch(e){ document.getElementById('globalCount').textContent="128"; }
}
updateVisitorCounters();
</script>
</body>
</html>
