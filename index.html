<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenéim + Vendégkönyv</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{margin:20px 0 5px;font-size:32px}
p.sub{color:#aaa;margin:0 0 20px;text-align:center}
#player-box{background:#1e1e1e;border-radius:20px;padding:20px;width:100%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#cover{width:100%;height:250px;background:linear-gradient(135deg,#6e45e2,#88d3ce);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px}
#now{margin:15px 0 10px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{width:100%;margin:10px 0}
#list{width:100%;max-width:500px;margin-top:20px}
.song{background:#1e1e1e;margin:8px 0;padding:12px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:0.2s}
.song:hover{background:#2a2a2a}
.song.active{background:#6e45e2}
.song span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.btn{border:none;background:#333;color:white;border-radius:50%;width:36px;height:36px;cursor:pointer}
#guestbook{width:100%;max-width:500px;margin-top:40px;background:#1e1e1e;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#guestbook h2{text-align:center;color:#6e45e2;margin:0 0 5px;font-size:22px}
#guestbook p.desc{text-align:center;color:#aaa;font-size:13px;margin:0 0 15px}
.g-input{width:100%;background:#2a2a2a;border:1px solid #333;color:white;padding:12px;border-radius:10px;margin:6px 0;font-family:inherit;box-sizing:border-box}
.g-input:focus{outline:none;border-color:#6e45e2}
.g-btn{width:100%;background:linear-gradient(135deg,#6e45e2,#88d3ce);border:none;color:white;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:15px}
.g-btn:hover{opacity:0.9}
.msg{background:#2a2a2a;padding:12px 15px;border-radius:12px;margin:10px 0;border-left:4px solid #6e45e2;animation:slideIn 0.3s}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg .head{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-bottom:6px}
.msg .name{color:#88d3ce;font-weight:bold}
.msg .text{color:#eee;word-wrap:break-word;white-space:pre-wrap}
.empty{text-align:center;color:#666;padding:20px;font-style:italic}
.del{color:#ff5555;cursor:pointer;font-size:12px;margin-left:10px}
.del:hover{text-decoration:underline}
</style>
</head>
<body>
<h1>🎵 Zenéim</h1>
<p class="sub">A feltöltött zenéim listája - kattints a lejátszáshoz</p>
<div id="player-box">
<div id="cover">🎧</div>
<div id="now">Válassz egy zenét...</div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>
<div id="list">Betöltés...</div>

<div id="guestbook">
<h2>💬 Vendégkönyv - Üzenőfal</h2>
<p class="desc">Hagyj üzenetet a zenékhez! 🎵 Itt marad!</p>
<input id="gName" class="g-input" placeholder="Neved... (pl: Laci)">
<textarea id="gText" class="g-input" rows="3" placeholder="Üzeneted... (pl: Király a Darude! 🎧)"></textarea>
<button class="g-btn" onclick="addMsg()">📩 Üzenet küldése</button>
<div id="gCount" style="text-align:center;color:#666;font-size:12px;margin-top:12px"></div>
<div id="gList" style="margin-top:10px"><div class="empty">Még nincs üzenet. Légy te az első! 👇</div></div>
<p style="text-align:center;color:#555;font-size:11px;margin-top:20px">💜 Saját vendégkönyv - nem visz el másik oldalra, itt marad minden</p>
</div>

<script>
const user = "kovacslaszlo19860503-jpg";
const repo = "oldalam";
const audio = document.getElementById('audio');
const now = document.getElementById('now');
const listDiv = document.getElementById('list');
async function loadSongs(){
 try{
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);
  const files = await res.json();
  const mp3s = files.filter(f=>{ const n=f.name.toLowerCase(); return n.endsWith('.mp3')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.mp4')||n.endsWith('.ogg')||n.endsWith('.flac'); });
  if(mp3s.length===0){
   listDiv.innerHTML = `<div style="text-align:center;color:#888;margin-top:20px">Még nincs feltöltve zene.<br>Tölts fel mp3 fájlokat a GitHub-ra!</div>`;
   return;
  }
  listDiv.innerHTML = "";
  mp3s.forEach((file)=>{
   const div = document.createElement('div');
   div.className = 'song';
   div.innerHTML = `<span>🎵 ${file.name}</span><button class="btn">▶</button>`;
   div.onclick = ()=>{
    document.querySelectorAll('.song').forEach(s=>s.classList.remove('active'));
    div.classList.add('active');
    audio.src = file.download_url;
    now.textContent = file.name;
    audio.play();
   };
   listDiv.appendChild(div);
  });
 }catch(e){ listDiv.innerHTML = "Hiba: "+e; }
}
loadSongs();
audio.addEventListener('ended', ()=>{
 const active = document.querySelector('.song.active');
 if(active && active.nextElementSibling) active.nextElementSibling.click();
});

// SAJÁT VENDÉGKÖNYV - NEM VISZ EL MÁSHOVA!
const KEY = "zene_vendegkonyv_v2";
function loadMsgs(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch{ return []; } }
function saveMsgs(m){ localStorage.setItem(KEY, JSON.stringify(m)); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(){
 const msgs = loadMsgs();
 const list = document.getElementById('gList');
 const count = document.getElementById('gCount');
 count.textContent = msgs.length ? `${msgs.length} üzenet` : "";
 if(msgs.length===0){ list.innerHTML=`<div class="empty">Még nincs üzenet. Légy te az első! 👇</div>`; return; }
 list.innerHTML="";
 [...msgs].reverse().forEach((m, revIdx)=>{
  const idx = msgs.length-1-revIdx;
  const d=document.createElement('div');
  d.className='msg';
  d.innerHTML=`<div class="head"><span class="name">👤 ${esc(m.name)}</span><span>${m.date} <span class="del" onclick="delMsg(${idx})">✕ törlés</span></span></div><div class="text">${esc(m.text)}</div>`;
  list.appendChild(d);
 });
}
function addMsg(){
 const nameEl=document.getElementById('gName');
 const textEl=document.getElementById('gText');
 const name=(nameEl.value.trim()||"Névtelen");
 const text=textEl.value.trim();
 if(!text){ alert("Írj üzenetet!"); return; }
 const now=new Date();
 const date=now.toLocaleDateString('hu-HU')+" "+now.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
 const msgs=loadMsgs();
 msgs.push({name,text,date});
 saveMsgs(msgs);
 textEl.value="";
 render();
}
function delMsg(i){
 if(!confirm("Törlöd ezt az üzenetet?")) return;
 const msgs=loadMsgs();
 msgs.splice(i,1);
 saveMsgs(msgs);
 render();
}
document.getElementById('gText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addMsg(); } });
render();
</script>
</body>
</html>
