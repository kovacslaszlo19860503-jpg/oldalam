<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenéim </title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#141e30,#243b55,#1a1a2e);background-attachment:fixed;color:white;font-family:Segoe UI,Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{margin:15px 0 5px;font-size:30px}
.sub{color:#aaa;margin-bottom:15px;font-size:13px;text-align:center}
#player{background:#1e1e1e;border-radius:20px;padding:18px;width:100%;max-width:520px;box-shadow:0 10px 30px rgba(0,0,0,0.5);margin-bottom:15px}
#cover{width:100%;height:200px;background:linear-gradient(135deg,#6e45e2,#88d3ce);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:70px}
#now{margin:12px 0 8px;font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
audio{width:100%;margin:8px 0}
#list{width:100%;max-width:520px;background:rgba(30,30,30,0.95);border-radius:15px;padding:12px;max-height:300px;overflow-y:auto;border:2px solid #6e45e2;margin-bottom:20px}
.song{background:#252525;margin:6px 0;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px}
.song.active{background:#6e45e2}
.song:hover{background:#2a2a2a}

/* CHAT */
#chatBox{width:100%;max-width:520px;background:#1e1e1e;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,0.5);border:1px solid #333}
#chatBox h2{text-align:center;color:#6e45e2;margin:0 0 3px;font-size:20px}
#chatBox .info{text-align:center;color:#666;font-size:11px;margin-bottom:12px}
#chatList{height:300px;overflow-y:auto;background:#121212;border-radius:12px;padding:10px;margin:10px 0;border:1px solid #2a2a2a;display:flex;flex-direction:column;gap:8px}
.msg{background:#252525;padding:10px 12px;border-radius:12px;max-width:85%;word-wrap:break-word;animation:fadeIn 0.3s}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#6e45e2,#88d3ce);color:white}
.msg.other{align-self:flex-start;border-left:3px solid #6e45e2}
.msg .meta{font-size:10px;color:#aaa;margin-bottom:3px;display:flex;justify-content:space-between}
.msg.me .meta{color:#e0e0e0}
.msg .text{font-size:14px;white-space:pre-wrap}
#chatInput{display:flex;gap:8px;margin-top:10px}
#chatInput input{flex:1;background:#2a2a2a;border:1px solid #333;color:white;padding:12px;border-radius:25px;outline:none}
#chatInput input:focus{border-color:#6e45e2}
#chatInput button{background:linear-gradient(135deg,#6e45e2,#88d3ce);border:none;color:white;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:18px}
#nameInput{width:100%;background:#2a2a2a;border:1px solid #333;color:white;padding:10px;border-radius:10px;margin-bottom:8px;box-sizing:border-box}
#status{text-align:center;font-size:11px;color:#666;margin-top:8px;height:14px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.counter{display:flex;justify-content:space-around;background:#1e1e1e;border-radius:12px;padding:10px 15px;width:100%;max-width:520px;margin-bottom:15px;border:1px solid #2a2a2a}
.counter div{text-align:center}
.counter span.num{font-size:20px;font-weight:bold;display:block}
.counter span.lab{font-size:10px;color:#aaa}
</style>
</head>
<body>
<h1>🎵 Zenéim</h1>
<p class="sub">Nézd meg a zenéket mindig ujak</p>

<div class="counter">
<div><span class="num" id="songCount">0</span><span class="lab">🎵 ZENE</span></div>
<div><span class="num" id="msgCount">0</span><span class="lab">💬 ÜZENET</span></div>
<div><span class="num" id="online">●</span><span class="lab" style="color:#55ff99">ONLINE</span></div>
</div>

<div id="player">
<div id="cover">🎧</div>
<div id="now">Válassz zenét...</div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>
<div id="list">Zene betöltés...</div>

<div id="chatBox">
<h2>💬 Chat</h2>
<p class="info">irj  üzit</p>
<input id="nameInput" placeholder="Neved" maxlength="20">
<div id="chatList"><div style="text-align:center;color:#555;padding:20px">Chat betöltés...<br><span style="font-size:11px">kvdb txt tárból</span></div></div>
<div id="chatInput">
<input id="msgInput" placeholder="Írj üzenetet..." maxlength="300" autocomplete="off">
<button onclick="sendMsg()" title="Küldés">➤</button>
</div>
<div id="status"></div>
</div>

<div style="margin-top:20px;color:#444;font-size:10px;text-align:center">Ha bármi gond van irj üzitbr>Frissítés 5 mp-enként</div>

<script>
const user = "kovacslaszlo19860503-jpg";
const repo = "oldalam";
const CHAT_BUCKET = "ozd-zenek-CHAT-UJ-2026-TXT";
const CHAT_KEY = "chat_uzenetek_txt";
const CHAT_URL = `https://kvdb.io/${CHAT_BUCKET}/${CHAT_KEY}`;

// ZENE BETÖLTÉS - token nélkül, public API
const audio=document.getElementById('audio');
const now=document.getElementById('now');
const listDiv=document.getElementById('list');
async function loadSongs(){
 try{
  const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/?t=${Date.now()}`);
  const files=await res.json();
  if(!Array.isArray(files)){ listDiv.innerHTML='<div style="text-align:center;color:#aaa">GitHub betöltés...</div>'; return; }
  const mp3s=files.filter(f=>{ const n=f.name.toLowerCase(); return n.endsWith('.mp3')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.ogg')||n.endsWith('.flac')||n.endsWith('.mp4'); });
  document.getElementById('songCount').textContent=mp3s.length;
  if(mp3s.length===0){ listDiv.innerHTML='<div style="text-align:center;color:#888;padding:20px">Még nincs zene<br><span style="font-size:12px">GitHub: Add file -> Upload files</span></div>'; return; }
  listDiv.innerHTML='';
  mp3s.forEach(file=>{
    const div=document.createElement('div'); div.className='song';
    div.innerHTML=`<span>🎵 ${file.name}</span><span>▶</span>`;
    div.onclick=()=>{ document.querySelectorAll('.song').forEach(s=>s.classList.remove('active')); div.classList.add('active'); audio.src=file.download_url; now.textContent=file.name; audio.play(); };
    listDiv.appendChild(div);
  });
 }catch(e){ listDiv.innerHTML='Hiba: '+e; }
}
loadSongs();
audio.addEventListener('ended',()=>{ const a=document.querySelector('.song.active'); if(a&&a.nextElementSibling) a.nextElementSibling.click(); });

// CHAT - TXT BE MENTVE, TOKEN NÉLKÜL
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadChat(){
 try{
  const r=await fetch(CHAT_URL+`?t=${Date.now()}`,{cache:'no-store'});
  if(r.ok){
    const txt=await r.text();
    if(txt && txt.trim()){
      const data=JSON.parse(txt);
      if(Array.isArray(data)) return data;
    }
  }
 }catch(e){ console.log('chat load hiba',e); }
 return [];
}

async function saveChat(msgs){
 try{
  await fetch(CHAT_URL, {method:'POST', body: JSON.stringify(msgs)});
  return true;
 }catch(e){
  document.getElementById('status').textContent='❌ Hiba mentéskor';
  return false;
 }
}

async function renderChat(){
 const list=document.getElementById('chatList');
 const msgs=await loadChat();
 document.getElementById('msgCount').textContent=msgs.length;
 if(msgs.length===0){
  list.innerHTML='<div style="text-align:center;color:#555;padding:30px">Még nincs üzenet<br>Legyél te az első! 👇</div>';
  return;
 }
 const myName=(document.getElementById('nameInput').value.trim().toLowerCase()||'');
 list.innerHTML='';
 msgs.slice(-50).forEach(m=>{ // utolsó 50
  const div=document.createElement('div');
  const isMe = myName && m.name && m.name.toLowerCase()===myName;
  div.className='msg '+(isMe?'me':'other');
  div.innerHTML=`<div class="meta"><span>${esc(m.name||'Névtelen')}</span><span>${esc(m.time||'')}</span></div><div class="text">${esc(m.text||'')}</div>`;
  list.appendChild(div);
 });
 list.scrollTop=list.scrollHeight;
}

renderChat();
setInterval(renderChat, 5000); // 5 mp-enként frissít

async function sendMsg(){
 const nameEl=document.getElementById('nameInput');
 const input=document.getElementById('msgInput');
 const status=document.getElementById('status');
 const name=nameEl.value.trim()||'Névtelen';
 const text=input.value.trim();
 if(!text){ status.textContent='Írj valamit!'; return; }
 if(text.length<1) return;

 status.textContent='⏳ Küldés...';
 input.disabled=true;

 const msgs=await loadChat();
 const now=new Date();
 const timeStr=now.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
 const dateStr=now.toLocaleDateString('hu-HU');

 msgs.push({name:name, text:text, time: timeStr, date: dateStr, ts: Date.now()});

 // max 200 üzenet maradjon, ne nőjön túl nagyra
 if(msgs.length>200) msgs.splice(0, msgs.length-200);

 const ok=await saveChat(msgs);
 if(ok){
  input.value='';
  status.textContent='✅ Elmentve txt-be!';
  localStorage.setItem('chat_nev', name);
  renderChat();
  setTimeout(()=>status.textContent='',2000);
 }else{
  status.textContent='❌ Nem sikerült';
 }
 input.disabled=false;
 input.focus();
}

// Enter-rel küldés
document.getElementById('msgInput').addEventListener('keydown', e=>{
 if(e.key==='Enter'){ e.preventDefault(); sendMsg(); }
});
document.getElementById('nameInput').addEventListener('keydown', e=>{
 if(e.key==='Enter'){ e.preventDefault(); document.getElementById('msgInput').focus(); }
});

// Név visszatöltés
const savedName=localStorage.getItem('chat_nev');
if(savedName) document.getElementById('nameInput').value=savedName;

// Online jel
setInterval(()=>{ const dot=document.getElementById('online'); dot.textContent= dot.textContent==='●' ? '○' : '●'; }, 800);
</script>
</body>
</html>
